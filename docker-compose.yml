services:
  # Backend Cliente .NET 8 con SQLite local (persistente via volumen)
  client:
    build:
      context: .
      dockerfile: Dockerfile
    image: sincro-vault/cliente:latest
    container_name: sincro-vault-client
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistir la BD SQLite entre rebuilds del container
      - ./data:/app/data
    environment:
      # SQLite — archivo dentro del volumen montado
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/secrets.db"
      # URL del servidor central — nombre del container en la red servidor_default
      Server__CentralUrl: "http://vault-app-nlb-2cdc4ee3bd437959.elb.us-east-1.amazonaws.com:9000"
      Server__InternalToken: "shared-secret-cliente-servidor-2026"
      # JWT
      Jwt__SecretKey: "EstaEsUnaClaveSuperSecretaParaDesarrollo2026!"
      Jwt__Issuer: "SecretsClient"
      Jwt__Audience: "SecretsClientUsers"
      # Aplicar migraciones EF Core automaticamente al arrancar
      RUN_MIGRATIONS_ON_STARTUP: "true"
      ASPNETCORE_ENVIRONMENT: "Production"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    driver: bridge
